{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "portal.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- /* KEDA creates its own HPA under the hood - hpa.enabled and keda.enabled are mutually exclusive by design to avoid two controllers fighting over replica count. */}}
{{- if and $svc.enabled $svc.hpa.enabled (not $svc.keda.enabled) (eq $svc.type "deployment") }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
{{- $fullname := include "portal.serviceFullname" (dict "root" $ "serviceName" $name) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "portal.labels" $ctx | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ $svc.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $svc.hpa.maxReplicas | default 5 }}
  metrics:
{{ toYaml $svc.hpa.metrics | indent 4 }}
  {{- if $svc.hpa.behavior }}
  behavior:
{{ toYaml $svc.hpa.behavior | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
