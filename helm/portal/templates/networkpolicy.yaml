{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "portal.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- if and $svc.enabled $svc.networkPolicy.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "portal.serviceFullname" (dict "root" $ "serviceName" $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "portal.labels" $ctx | indent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "portal.selectorLabels" $ctx | indent 6 }}
  policyTypes:
{{ toYaml ($svc.networkPolicy.policyTypes | default (list "Ingress")) | indent 4 }}
  {{- if $svc.networkPolicy.ingress }}
  ingress:
{{ toYaml $svc.networkPolicy.ingress | indent 4 }}
  {{- end }}
  {{- if $svc.networkPolicy.egress }}
  egress:
{{ toYaml $svc.networkPolicy.egress | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
