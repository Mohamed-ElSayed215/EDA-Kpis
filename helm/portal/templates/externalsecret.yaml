{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "portal.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- if and $svc.enabled $svc.externalSecret.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
{{- $fullname := include "portal.serviceFullname" (dict "root" $ "serviceName" $name) }}
{{- $targetName := $svc.externalSecret.nameOverride | default $fullname }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "portal.labels" $ctx | indent 4 }}
spec:
  refreshInterval: {{ $svc.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required (printf "services.%s.externalSecret.secretStoreRef.name is required" $name) $svc.externalSecret.secretStoreRef.name }}
    kind: {{ $svc.externalSecret.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
  {{- if $svc.externalSecret.data }}
  data:
{{ toYaml $svc.externalSecret.data | indent 4 }}
  {{- end }}
  {{- if $svc.externalSecret.dataFrom }}
  dataFrom:
{{ toYaml $svc.externalSecret.dataFrom | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}