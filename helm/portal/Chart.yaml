apiVersion: v2
name: portal
description: >-
  Generic, multi-service Helm chart for the Portal platform monorepo.
  Renders any number of services (frontend, backend, workers, cronjobs,
  schedulers, etc.) from a single set of templates, driven entirely by
  values. Adding a new service to the platform requires NO new templates -
  only an entry under `services` in the appropriate values file.

# Chart type:
#   "application" - this chart renders deployable Kubernetes resources.
#   We deliberately do NOT use "library" here: a library chart renders
#   nothing on its own and must be imported by a per-service chart, which
#   would reintroduce "one chart per service" and break the goal of
#   adding services via values-only changes.
type: application

# Chart version - bump on every change to templates, schema, or default
# values. This is what ArgoCD/Helm track as the chart release, and is
# independent of any application/image version.
version: 0.1.0

# appVersion - informational only. Does NOT drive any image tag logic in
# this chart. Each service under `.Values.services.<name>.image.tag`
# controls its own image version independently. This field exists purely
# for display (e.g. in `helm list`, ArgoCD UI) and should reflect the
# platform/chart's own release line, not any single service's version.
appVersion: "1.0.0"

# Minimum Kubernetes version this chart's manifests are guaranteed to be
# compatible with. Chosen because it guarantees stable API groups we rely
# on later: autoscaling/v2 (HPA), policy/v1 (PodDisruptionBudget),
# discovery.k8s.io/v1. Raise or lower only after confirming your fleet's
# actual minimum cluster version.
kubeVersion: ">=1.26.0-0"

keywords:
  - portal
  - monorepo
  - generic-chart
  - multi-service

home: https://github.com/your-org/portal-platform
sources:
  - https://github.com/your-org/portal-platform

maintainers:
  - name: Platform Engineering Team
    email: platform-eng@your-org.example
    url: https://github.com/your-org

# No `dependencies:` block by design - see architecture review notes.
# All shared rendering logic lives in templates/_helpers.tpl, owned and
# versioned entirely within this repo, to avoid an external chart
# dependency drifting underneath a chart maintained for years by multiple
# engineers.
