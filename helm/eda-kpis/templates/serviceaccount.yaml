{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "eda-kpis.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- if and $svc.enabled $svc.serviceAccount.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eda-kpis.serviceAccountName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "eda-kpis.labels" $ctx | indent 4 }}
  {{- if $svc.serviceAccount.annotations }}
  annotations:
{{ toYaml $svc.serviceAccount.annotations | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $svc.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
{{- end }}
