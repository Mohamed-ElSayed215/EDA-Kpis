{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "eda-kpis.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- if and $svc.enabled $svc.secret.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
{{- $secretName := $svc.secret.nameOverride | default (include "eda-kpis.serviceFullname" (dict "root" $ "serviceName" $name)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "eda-kpis.labels" $ctx | indent 4 }}
type: {{ $svc.secret.type | default "Opaque" }}
{{- if $svc.secret.data }}
data:
{{ toYaml $svc.secret.data | indent 2 }}
{{- end }}
{{- if $svc.secret.stringData }}
stringData:
{{ toYaml $svc.secret.stringData | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
