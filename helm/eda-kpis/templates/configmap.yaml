{{- range $name, $rawSvc := .Values.services }}
{{- $svc := include "eda-kpis.mergedService" (dict "root" $ "serviceName" $name) | fromYaml }}
{{- if and $svc.enabled $svc.configMap.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "serviceName" $name }}
{{- $cmName := $svc.configMap.nameOverride | default (include "eda-kpis.serviceFullname" (dict "root" $ "serviceName" $name)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "eda-kpis.labels" $ctx | indent 4 }}
{{- if $svc.configMap.data }}
data:
{{ toYaml $svc.configMap.data | indent 2 }}
{{- end }}
{{- if $svc.configMap.binaryData }}
binaryData:
{{ toYaml $svc.configMap.binaryData | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
