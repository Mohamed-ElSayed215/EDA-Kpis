# ==============================================================================
# GLOBAL DEFAULTS
# Every field here is inherited by every service in `services:` below, and
# can be overridden per-service. See templates/_helpers.tpl -> mergedService.
# ==============================================================================
global:
  imagePullSecrets:
    - name: harbor-secret
  partOf: eda-kpis

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

  serviceAccount:
    enabled: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600

  terminationGracePeriodSeconds: 30

  podAntiAffinity:
    enabled: false
    type: preferred # preferred | required
    topologyKey: kubernetes.io/hostname
    weight: 100

  nodeAffinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""

  startupProbe:
    enabled: false
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70

  keda:
    enabled: false
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 0
    maxReplicaCount: 10
    triggers: []

  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: null

  networkPolicy:
    enabled: false
    policyTypes: ["Ingress"]
    ingress: []
    egress: []

  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    port: http
    labels: {}

  podMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    port: http
    labels: {}

  prometheusRule:
    enabled: false
    groups: []

  externalSecret:
    enabled: false
    secretStoreRef:
      name: ""
      kind: SecretStore
    refreshInterval: 1h
    data: []

  rbac:
    enabled: false
    rules: []
  clusterRbac:
    enabled: false
    rules: []

  annotations: {}
  podAnnotations: {}
  labels: {}
  podLabels: {}

  env: []
  envFrom: []
  volumes: []
  volumeMounts: []
  initContainers: []
  sidecars: []

  lifecycle:
    preStop: {}
    postStart: {}

  pvc:
    enabled: false
    claims: []

# ==============================================================================
# SERVICES
# `type` is the workload discriminator consumed by templates/workload.yaml:
#   deployment | statefulset | cronjob | job
# Every key below is optional at the service level and falls back to
# `global.*` if omitted (see mergedService helper).
# ==============================================================================
services:
  frontend:
    enabled: true
    type: deployment
    replicaCount: 2
    image:
      repository: your-registry.example.com/eda-kpis/frontend
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 8080 
    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 8080
    ingress:
      enabled: false
      className: nginx
      annotations: {}
      hosts:
        - host: frontend.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
    readinessProbe:
      enabled: false
      httpGet:
        path: /healthz
        port: 8080
    livenessProbe:
      enabled: false
      httpGet:
        path: /healthz
        port: 8080
    configMap:
      enabled: false
      data: {}
    secret:
      enabled: false
      data: {}

  backend:
    enabled: true
    type: deployment
    replicaCount: 2
    image:
      repository: your-registry.example.com/eda-kpis/backend
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    service:
      enabled: true
      type: ClusterIP
      port: 3000
      targetPort: 3000
    ingress:
      enabled: false
    readinessProbe:
      enabled: false
      httpGet:
        path: /health/ready
        port: 3000
    livenessProbe:
      enabled: false 
      httpGet:
        path: /health/live
        port: 3000
    configMap:
      enabled: false
      data: {}
    secret:
      enabled: false
      data: {}

  # Example CronJob-type service - demonstrates adding a non-Deployment
  # workload purely through values, no new template needed.
  # Disabled by default; enable + configure in an environment values file.
  report-generator:
    enabled: false
    type: cronjob
    image:
      repository: your-registry.example.com/eda-kpis/report-generator
      tag: ""
      pullPolicy: IfNotPresent
    schedule: "0 2 * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    suspend: false
    backoffLimit: 2
    restartPolicy: OnFailure

  # Example Job-type service - one-shot migration job.
  db-migration:
    enabled: false
    type: job
    image:
      repository: your-registry.example.com/eda-kpis/db-migration
      tag: ""
      pullPolicy: IfNotPresent
    backoffLimit: 3
    completions: 1
    parallelism: 1
    ttlSecondsAfterFinished: 3600
    restartPolicy: Never
