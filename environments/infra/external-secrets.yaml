# Cluster-wide infrastructure - installed ONCE, shared by every namespace
# and every application chart (including eda-kpis). This is deliberately
# NOT a dependency inside helm/eda-kpis/Chart.yaml - see the architecture
# note in argocd/infra/README.md for why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # deploy before any app that depends on it (e.g. eda-kpis-*)
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4 # pin explicitly - never float on `latest` for cluster-scoped infra
    helm:
      values: |
        installCRDs: true
        crds:
          createClusterExternalSecret: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # ESO's CRDs are large - server-side apply avoids the
                              # same "annotation too long" error we hit with ArgoCD's own CRDs
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
