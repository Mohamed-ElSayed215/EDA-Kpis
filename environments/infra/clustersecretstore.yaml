# The ClusterSecretStore that every ExternalSecret in environments/local
# references as `secretStoreRef.name: vault-backend`. This was referenced
# by name throughout the repo but never actually defined anywhere — without
# it, every ExternalSecret fails to sync and no Secret ever gets created.
#
# Applied cluster-wide by infra-root (same directory-apply mechanism as
# vault.yaml / external-secrets.yaml next to this file).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # In-cluster Vault service address (namespace "vault", service "vault",
      # matching vault.yaml's destination namespace).
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eda-kpis-backend
          serviceAccountRef:
            name: eda-kpis-local-backend
            namespace: eda-kpis-local
