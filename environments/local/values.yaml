global:
  imagePullSecrets: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  hpa:
    enabled: false
  keda:
    enabled: false
  pdb:
    enabled: false
  networkPolicy:
    enabled: false
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  externalSecret:
    enabled: false
  topologySpreadConstraints: []
  podAntiAffinity:
    enabled: false
services:
  frontend:
    replicaCount: 1
    containerPort: 8080
    image:
      # Built locally: docker build -t eda-kpis-frontend:v1 .
      # Then loaded into the kind cluster: kind load docker-image eda-kpis-frontend:v1
      repository: eda-kpis-frontend
      tag: "v3"
      # Never (not IfNotPresent/Always): this image exists ONLY inside the
      # kind node's local image cache — there is no registry to pull from,
      # so the kubelet must never attempt one.
      pullPolicy: Never
    ingress:
      enabled: false
    # NOTE: this value must be reachable from the USER'S BROWSER, not from
    # inside the cluster — the frontend's JS runs client-side. For local
    # dev that's the kubectl port-forward address; for staging/prod this
    # would be the real public Ingress domain for the backend. Consumed at
    # container startup by docker/generate-env-config.sh (envsubst into
    # assets/env.js), NOT baked into the JS bundle at build time — so the
    # same image can be reused across environments just by changing this.
    configMap:
      enabled: true
      nameOverride: eda-kpis-cm-frontend
      data:
        API_URL: "http://localhost:3001/kpi-service/api/v1"
    envFrom:
      - configMapRef:
          name: eda-kpis-cm-frontend
    readinessProbe:
      enabled: false
    livenessProbe:
      enabled: false
    volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-run
        mountPath: /var/run
      - name: tmp
        mountPath: /tmp
  backend:
    replicaCount: 1
    containerPort: 3000
    image:
      # Built locally: docker build -t eda-kpis-backend:v1 .
      # Then loaded into the kind cluster: kind load docker-image eda-kpis-backend:v1
      repository: eda-kpis-backend
      tag: "v1"
      pullPolicy: Never
    ingress:
      enabled: false
    readinessProbe:
      enabled: false
    livenessProbe:
      enabled: false
    # Non-sensitive config, rendered as a ConfigMap by templates/configmap.yaml
    # under the custom name set in nameOverride below.
    configMap:
      enabled: true
      nameOverride: eda-kpis-cm-backend
      data:
        MODE: "LOCAL"
        PORT: "3000"
        DB_SSL: "false"
        RUN_MIGRATIONS: "true"
        LOGGING: "true"
        LOGGING_TYPE: "console"
        CONSOLE_LOG_LEVEL: "debug"
        FILE_LOG_LEVEL_1: "info"
        FILE_LOG_LEVEL_2: "error"
        JWT_EXPIRE: "86400"
        IGNORE_JWT_EXPIRE: "false"
        AXIOS_TIMEOUT: "60000"
        AXIOS_REDIRECTS: "5"
        AXIOS_TIMEOUTAXIOS_REDIRECTS: "5"
        FILE_STORAGE_DRIVER: "local"
        CORS_ORIGIN: "http://localhost:8080"
        # Points at the docker-compose Postgres container, reachable by
        # name after: docker network connect kind eda-kpis-db
        #  POSTGRES_HOST: "eda-kpis-db"
        #POSTGRES_PORT: "5432"
        #POSTGRES_DATABASE: "eda_kpis"
        # Real standalone DB server (eda-mobdb-test), reachable directly
        # over the network — no docker network connect trick needed here.
        POSTGRES_HOST: "10.10.1.3"
        POSTGRES_PORT: "5432"
        POSTGRES_DATABASE: "eda_kpis"
        # Redis requires a password (see requirepass in /etc/redis.conf on
        # the DB server) — included directly in the connection string.
        REDIS_CONFIG: "redis://:P@ssw0rd@123@10.10.1.3:6379"  
        # Points at the docker-compose Redis container, reachable by name
        # after: docker network connect kind eda-kpis-redis
          # REDIS_CONFIG: "redis://eda-kpis-redis:6379"
    # All backend SECRETS come from Vault via ESO. `dataFrom.extract`
    # pulls every key under this one Vault path at once - no need to
    # list all fields individually (see `data:` alternative in
    # externalsecret.yaml if you ever need per-key renaming instead).
    secret:
      enabled: false
    externalSecret:
      enabled: true
      nameOverride: eda-kpis-secrets-backend
      refreshInterval: 15s
      secretStoreRef:
        name: vault-backend
        kind: ClusterSecretStore
      dataFrom:
        - extract:
            key: eda-kpis-backend/config
    envFrom:
      # Non-sensitive values from the ConfigMap above.
      - configMapRef:
          name: eda-kpis-cm-backend
      # Sensitive values synced from Vault by the ExternalSecret above.
      - secretRef:
          name: eda-kpis-secrets-backend
